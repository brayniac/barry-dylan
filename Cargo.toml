[package]
name = "barry-dylan"
version = "0.3.5"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "barry-dylan"
path = "src/main.rs"

# Packaged so `review-offline` can run inside an ephemeral guest. The job
# installs it at run time from the rack's internal apt repo rather than it
# being baked into a guest image, so shipping a new barry does not mean
# rebuilding a 7.5 GB image.
[package.metadata.deb]
maintainer = "Brian Martin <brian@brayniac.com>"
section = "utils"
priority = "optional"
assets = [
    ["target/release/barry-dylan", "usr/bin/", "755"],
]
depends = "libc6"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
axum = { version = "0.8", features = ["macros"] }
hyper = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
# preserve_order: the relay re-serializes a body GitHub signed, and the default
# BTreeMap-backed Value sorts keys, which would break every signature.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
async-trait = "0.1"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "time"] }
time = { version = "0.3", features = ["serde", "macros"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
globset = "0.4"
url = "2"
futures = "0.3"
parking_lot = "0.12"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
pretty_assertions = "1"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

[[test]]
name = "integration"
path = "tests/integration/main.rs"
